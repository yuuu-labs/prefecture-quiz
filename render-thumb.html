<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1200px;height:630px;overflow:hidden;
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 10% 8%, rgba(255,93,162,.28), transparent 32%),
      radial-gradient(circle at 92% 4%, rgba(139,111,242,.26), transparent 34%),
      radial-gradient(circle at 88% 92%, rgba(47,214,196,.22), transparent 36%),
      radial-gradient(circle at 4% 96%, rgba(255,210,63,.16), transparent 30%),
      linear-gradient(180deg, #221d40 0%, #100f1a 100%);
    position:relative;
  }
  .tag{
    position:absolute; left:80px; top:66px;
    display:inline-block; font-size:26px; font-weight:700;
    padding:14px 26px; border-radius:30px;
    background:rgba(255,93,162,.16); color:#ff5da2;
  }
  .icons{
    position:absolute; left:80px; top:150px;
    font-size:52px; letter-spacing:18px;
  }
  .headline{
    position:absolute; left:80px; top:222px;
    font-size:68px; font-weight:800; color:#f5f3fb; line-height:1.28;
  }
  .headline .accent{ color:#ffd23f; display:block; }
  .subtitle{
    position:absolute; left:80px; top:432px;
    font-size:40px; font-weight:800; color:#2fd6c4;
  }
  .desc{
    position:absolute; left:80px; top:500px;
    font-size:26px; color:#a79fc4;
  }
  .badge{
    position:absolute; right:80px; top:428px;
    font-size:30px; font-weight:800; color:#fff;
    background:rgba(139,111,242,.92);
    padding:16px 32px; border-radius:30px;
  }
  .url{
    position:absolute; right:80px; bottom:56px;
    font-size:24px; font-weight:700; color:#a79fc4;
  }
</style>
</head>
<body>
  <div class="tag">総務省統計局「家計調査」トリビア</div>
  <div class="icons">🥟 🍜 🍚 ☕ 🍞</div>
  <div class="headline">その「日本一」、<span class="accent">思い込みかも？</span></div>
  <div class="subtitle">都道府県当てクイズ</div>
  <div class="desc">水戸は納豆で本当に日本一？ 家計調査の「本当の1位」で遊ぶ雑学クイズ</div>
  <div class="badge">全91問収録</div>
  <div class="url">yuuu-labs.github.io/prefecture-quiz</div>
</body>
</html>
